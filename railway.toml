[build]
builder = "nixpacks"
watchPatterns = ["backend/**"]

[deploy]
startCommand = "cd backend && /app/.venv/bin/uvicorn main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 120"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
